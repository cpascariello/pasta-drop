name: Aleph Cloud Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to deploy'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Report queued
        run: |
          curl -sS -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"queued"}'
        env:
          BACKEND_URL: ${{ secrets.ALEPH_BACKEND_URL }}
          DEPLOY_TOKEN: ${{ secrets.ALEPH_DEPLOY_TOKEN }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          curl -sS -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"installing"}'
          npm ci
        env:
          BACKEND_URL: ${{ secrets.ALEPH_BACKEND_URL }}
          DEPLOY_TOKEN: ${{ secrets.ALEPH_DEPLOY_TOKEN }}

      - name: Build
        run: |
          curl -sS -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"building"}'
          npm run build
        env:
          BACKEND_URL: ${{ secrets.ALEPH_BACKEND_URL }}
          DEPLOY_TOKEN: ${{ secrets.ALEPH_DEPLOY_TOKEN }}

      - name: Upload artifact
        run: |
          curl -sS -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"uploading"}'
          tar -czf /tmp/build.tar.gz -C ./dist .
          curl -sS -X POST "$BACKEND_URL/api/deploy/upload" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -F "artifact=@/tmp/build.tar.gz" \
            -F "commit=${{ github.event.inputs.commit || github.sha }}" \
            -F "actionsRunUrl=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          BACKEND_URL: ${{ secrets.ALEPH_BACKEND_URL }}
          DEPLOY_TOKEN: ${{ secrets.ALEPH_DEPLOY_TOKEN }}

      - name: Report failure
        if: failure()
        run: |
          curl -sS -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Build or deploy step failed"}'
        env:
          BACKEND_URL: ${{ secrets.ALEPH_BACKEND_URL }}
          DEPLOY_TOKEN: ${{ secrets.ALEPH_DEPLOY_TOKEN }}
